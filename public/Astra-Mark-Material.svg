<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">Astra Material Mark</title>
  <desc id="description">Astra medical cross mark with a filled center and transparent background.</desc>
  <defs>
    <linearGradient id="astra-material" x1="309" y1="222" x2="715" y2="802" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#373737"/>
      <stop offset="0.44" stop-color="#111111"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="astra-highlight" cx="402.6" cy="338" r="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d5d5d"/>
      <stop offset="0.34" stop-color="#5d5d5d" stop-opacity="0"/>
      <stop offset="1" stop-color="#5d5d5d" stop-opacity="0"/>
    </radialGradient>
    <mask id="astra-silhouette" x="0" y="0" width="1024" height="1024" maskUnits="userSpaceOnUse" style="mask-type:luminance">
      <image href="data:image/png;base64," x="0" y="0" width="1024" height="1024"/>
    </mask>
    <filter id="astra-shadow" x="-512" y="-512" width="2048" height="2304" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="132.9" result="far-blur"/>
      <feOffset in="far-blur" dy="110.8" result="far-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.16" result="far-color"/>
      <feComposite in="far-color" in2="far-offset" operator="in" result="far-shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="36.9" result="near-blur"/>
      <feOffset in="near-blur" dy="29.5" result="near-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.11" result="near-color"/>
      <feComposite in="near-color" in2="near-offset" operator="in" result="near-shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.2" result="edge-blur"/>
      <feOffset in="edge-blur" dy="-4.1" result="edge-offset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.16" result="edge-color"/>
      <feComposite in="edge-color" in2="edge-offset" operator="in" result="edge-highlight"/>
      <feMerge>
