  <path d="M512 283L548.64 447.88L741 512L548.64 576.12L512 741L475.36 576.12L283 512L475.36 447.88Z" fill="url(#astra-material)"/>
  <path d="M512 283L548.64 447.88L741 512L548.64 576.12L512 741L475.36 576.12L283 512L475.36 447.88Z" fill="url(#astra-highlight)"/>
